/* ─── TOKENS ─── */
:root {

  --ink-3: #7a746c;

  --rule: #d4cec4;
  --night: #0d0c0a;

}

.page {
  max-width: var(--wide);
  margin: 0 auto;

  display: grid;
  grid-template-columns: 1fr 260px;
  gap: 64px;

}
.body { padding: 56px 0 80px; min-width: 0; }
.stick { padding: 56px 0 80px; position: sticky; top: 68px; }

  font-size: 1.06rem;

.body em { font-style: italic; color: var(--ink-2); }
.body a {
  color: var(--slate);

.body h2 {
  font-family: 'Fraunces', serif;

  color: var(--ink);
  line-height: 1.2;
  margin: 3.5rem 0 1rem;
  letter-spacing: -0.01em;

  padding-left: 20px;
}

  content: '';

  font-family: 'Fraunces', serif;

  font-style: italic;
}

  margin-top: 6px;
  color: var(--ember);
}

.then-now {
  margin: 2rem 0 2.5rem;
  border: 1px solid var(--rule);
  overflow: hidden;
  background: var(--white);
}
.tn-head {
  display: grid; grid-template-columns: 1fr 1fr;
}
.tn-label {
  padding: 10px 20px;
  font-family: 'Fira Code', monospace;
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.tn-label.t { background: var(--paper-dark); color: var(--ink-3); border-right: 1px solid var(--rule); }
.tn-label.n { background: var(--night); color: var(--ink-4); }
.tn-row { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--rule); }
.tn-cell { padding: 13px 20px; font-size: 0.88rem; line-height: 1.5; }
.tn-cell.t {
  background: var(--paper);
  color: var(--ink-3);
  border-right: 1px solid var(--rule);

  background: var(--white);
  color: var(--ink);

}
.tn-cell.n::before { content: '✓ '; color: var(--sage); font-weight: 700; }

/* ─── CALLOUT ─── */
.callout {

.stat-mosaic {

.tbl-wrap {
